<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Language Arabic -->
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title WebSite Online Store -->
    <title>Online Store | Mohamed Samy</title>

    <!-- Link FlowBite And Tailwind CSS -->

    <!-- Link Font Awesome  -->

    <!-- Link Favaicon -->
    <link rel="shortcut icon" href="/online-store/assets/icon-CcAOcUAS.png" type="image/x-icon">

    <!-- Link Style SASS -->
  <script type="module" crossorigin src="/online-store/assets/index-DjOeyddA.js"></script>
  <link rel="stylesheet" crossorigin href="/online-store/assets/index-CQ5vg7Vm.css">
</head>

<body>

    <!-- Header Start -->
    <header class="py-4 shadow-sm">
        <div class="container mx-auto px-4 flex flex-col gap-4">

            <!-- Header Top Start -->
            <div class="header-top flex justify-between items-center">
                <div class="w-[180px] cursor-pointer hover:scale-[1.1] ease-in-out duration-300">
                    <img src="/online-store/assets/logo-CItff2sL.png" alt="Logo">
                </div>

                <div class="flex items-center bg-border rounded-lg overflow-hidden h-14">
                    <select class="border-0 bg-transparent px-4 w-auto h-full text-center font-bold text-[16px] outline-none cursor-pointer">
                        <option value="all">All Categories</option>
                        <option value="electronics">Electronics & Digita</option>
                        <option value="phones">Phones & Tablety</option>
                        <option value="fashion">Fashion & Clothings</option>
                        <option value="tv">Telivsion & Monitor</option>
                        <option value="jewelry">Jewelry & Watches</option>
                        <option value="washing">Washing Machine</option>
                        <option value="toys">Toys & Hobbies</option>
                    </select>

                    <!-- الخط الفاصل بين الـ Select والـ Input -->
                    <div class="h-10 w-[2px] bg-gray-400"></div>

                    <input class="w-96 h-full bg-transparent px-4 border-0 text-[16px] font-bold outline-none"
                        type="text" placeholder="Search For Products">

                    <button class="w-14 text-white h-full bg-main cursor-pointer hover:bg-orange-500 duration-300 flex items-center justify-center">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <!-- أيقونات المفضلة والسلة -->
                <div class="flex items-center gap-7">
                    <button class="cursor-pointer relative">
                        <i class="text-[23px] fa-regular fa-heart"></i>
                        <span class="absolute -top-2 -right-3 z-10 bg-main text-white w-5 h-5 rounded-full flex justify-center items-center text-xs font-bold">0</span>
                    </button>
                    <button class="cursor-pointer relative">
                        <i class="text-[23px] fa-solid fa-cart-shopping"></i>
                        <span class="absolute -top-2 -right-3 z-10 bg-main text-white w-5 h-5 rounded-full flex justify-center items-center text-xs font-bold">2</span>
                    </button>
                </div>
            </div>
            <!-- Header Top End -->

            <!-- Header Bottom Start -->
            <div class="header-bottom border-t border-border flex justify-between items-center pt-4">
                <!-- زر تصفح الأقسام (Browse Category) -->
                <div class="bg-main text-white px-6 py-3 rounded-lg flex items-center justify-between w-72 cursor-pointer hover:bg-orange-600 duration-300 font-bold">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-bars text-lg"></i>
                        <span>Browse Category</span>
                    </div>
                    <i class="fa-solid fa-chevron-down text-sm"></i>
                </div>

                <!-- روابط التنقل الرئيسية (Navigation Links) -->
                <ul class="flex items-center gap-8 font-semibold text-heading">
                    <li><a href="#" class="text-main duration-300">Home</a></li>
                    <li><a href="#" class="hover:text-main duration-300">About</a></li>
                    <li><a href="#" class="hover:text-main duration-300">Accesories</a></li>
                    <li><a href="#" class="hover:text-main duration-300">Blog</a></li>
                    <li><a href="#" class="hover:text-main duration-300">Contact</a></li>
                </ul>

                <!-- أزرار الدخول والتسجيل (Login & Sign Up) -->
                <div class="flex items-center gap-4">
                    <a href="#" class="bg-main text-white px-5 py-2.5 rounded-lg font-bold flex items-center gap-2 hover:bg-orange-600 duration-300">
                        <span>Login</span>
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </a>
                    <a href="#" class="bg-main text-white px-5 py-2.5 rounded-lg font-bold flex items-center gap-2 hover:bg-orange-600 duration-300">
                        <span>Sign UP</span>
                        <i class="fa-solid fa-user-plus"></i>
                    </a>
                </div>
            </div>
            <!-- Header Bottom End -->

        </div>
    </header>
